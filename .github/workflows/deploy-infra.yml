# ============================================================
# Scholar Profile — Infrastructure Deployment
# Deploys Bicep templates to Azure on push to main
# ============================================================
name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch: # Allow manual trigger

permissions:
  id-token: write
  contents: read

env:
  LOCATION: eastasia

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ env.LOCATION }}
          template: ./infra/main.bicep
          parameters: >
            repositoryUrl=${{ github.server_url }}/${{ github.repository }}
            repositoryToken=${{ secrets.AZURE_STATIC_WEB_APPS_REPOSITORY_TOKEN }}
          deploymentName: scholar-profile-${{ github.run_number }}